apiVersion: apps/v1
kind: Deployment

metadata:
  name: enterprise-devops-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: enterprise-devops-app

  template:
    metadata:
      labels:
        app: enterprise-devops-app

    spec:
      containers:
        - name: enterprise-devops-app
          image: divyamsh1316/enterprise-devops-app:latest

          ports:
            - containerPort: 5000

          imagePullPolicy: Always

          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "500m"